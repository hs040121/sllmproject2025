<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Gemma 2B Text Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="Gemma2B.js"></script>
</head>

<body>
    <div class="p-5 bg-primary text-white text-center">
        <h1>방현석의 첫 지능 채팅 서비스</h1>
    </div>

    <div class="container mt-4">
        <h2>Gemma 2B Text Generator</h2>

        <!-- 사용자 입력창 -->
        <input type="text" id="userPrompt" class="form-control mb-3" placeholder="명령어나 문장을 입력하세요" />

        <!-- 생성 버튼 -->
        <button class="btn btn-success" onclick="generateText()">Generate</button>

        <!-- 결과 출력 -->
        <div class="mt-4">
            <h5>생성 결과:</h5>
            <p id="result" style="white-space: pre-wrap;"></p>
        </div>
    </div>
</body>
</html>
